<svg width="1000" height="570" viewBox="0 0 1000 570" fill="none"
xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="identity-title identity-desc">
  <title id="identity-title">Identity profile — Matías Pizarro Acevedo</title>
  <desc id="identity-desc">Technical profile panel with synchronized ASCII portrait reveal and profile information.</desc>

  <defs>
    <style>
      .display{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-.045em}
      .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
      .meta{fill:#B5B5B1;font-size:10.8px;letter-spacing:1.75px}
      .label{fill:#8A8A8A;font-size:10.8px;letter-spacing:.65px}
      .value{fill:#F5F5F2;font-size:11.45px;font-weight:650;letter-spacing:.12px}
      .hairline{stroke:#F5F5F2;stroke-opacity:.16}
      .card{fill:#0A0A0A;stroke:#F5F5F2;stroke-opacity:.18}
      .corner{stroke:#F5F5F2;stroke-opacity:.72;stroke-width:1.2}
      .leader{stroke:#F5F5F2;stroke-opacity:.20;stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round}
      .cursor{fill:#F5F5F2;animation:blink 1.1s steps(1,end) infinite}
      .signal-bar{fill:#F5F5F2;animation:signal 3.8s ease-in-out infinite}
      .status-dot{fill:#F5F5F2;animation:pulse 2.8s ease-in-out infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes signal{0%,100%{opacity:.22;transform:scaleX(.28)}50%{opacity:.85;transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){.cursor,.signal-bar,.status-dot{animation:none!important}}
    
      .reveal-window{transform-box:fill-box;transform-origin:center top;animation:portraitReveal 16s linear infinite}
      .scanner-travel{animation:scannerTravel 16s linear infinite}
      .scanner-light{animation:scannerLight 16s linear infinite;opacity:0}
      @keyframes portraitReveal{0%{transform:scaleY(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}76%{transform:scaleY(1)}92%{transform:scaleY(1);animation-timing-function:cubic-bezier(.4,0,.2,1)}100%{transform:scaleY(0)}}
      @keyframes scannerTravel{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.22,1,.36,1)}76%,100%{transform:translateY(316px)}}
      @keyframes scannerLight{0%{opacity:0}5%{opacity:.68}72%{opacity:.46}78%,100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.reveal-window{animation:none!important;transform:scaleY(1)}.scanner-travel{display:none}.scanner-light{animation:none!important}}
    </style>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke="#141414" stroke-width="1"/>
    </pattern>

    <linearGradient id="bgFade" x1="0" y1="0" x2="1000" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset=".55" stop-color="#070707"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>

    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5F5F2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F5F5F2" stop-opacity=".14"/>
      <stop offset="1" stop-color="#F5F5F2" stop-opacity="0"/>
    </linearGradient>

    <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="portraitClip">
      <rect x="38" y="98" width="350" height="398" rx="10"/>
    </clipPath>

    <mask id="portraitReveal" maskUnits="userSpaceOnUse" x="38" y="98" width="350" height="398"><rect x="58" y="130" width="310" height="316" class="reveal-window" fill="white"/></mask>

    <clipPath id="asciiFrame">
      <rect x="58" y="130" width="310" height="316" rx="2"/>
    </clipPath>

    <clipPath id="systemClip">
      <rect x="408" y="98" width="554" height="398" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1000" height="570" fill="url(#bgFade)"/>
  <rect width="1000" height="570" fill="url(#grid)" opacity=".34"/>
  <rect width="1000" height="570" filter="url(#noise)" opacity=".018"/>
  <rect width="1000" height="2" fill="#F5F5F2" opacity=".78"/>

  <text x="38" y="31" class="mono meta">IDENTITY / 001</text>
  <text x="946" y="31" text-anchor="end" class="mono meta">CHILE · PROFILE ONLINE</text>
  <circle cx="960" cy="27.5" r="2.5" class="status-dot"/>
  <text x="38" y="68" class="display" font-size="24" fill="#F5F5F2">VISUAL.MAP</text>
  <text x="408" y="68" class="display" font-size="24" fill="#F5F5F2">SYSTEM.INFO</text>
  <line x1="38" y1="80" x2="962" y2="80" class="hairline"/>

  <rect x="38" y="98" width="350" height="398" rx="10" class="card"/>
  <rect x="408" y="98" width="554" height="398" rx="10" class="card"/>
  <path d="M38 116V108C38 102.477 42.477 98 48 98H56" class="corner"/>
  <path d="M962 116V108C962 102.477 957.523 98 952 98H944" class="corner" opacity=".38"/>
  <path d="M408 116V108C408 102.477 412.477 98 418 98H426" class="corner" opacity=".38"/>

  <g clip-path="url(#portraitClip)">
    <rect x="38" y="98" width="350" height="398" fill="url(#grid)" opacity=".34"/>
    <rect x="38" y="98" width="350" height="398" fill="#000" opacity=".16"/>
    <text x="58" y="121" class="mono" font-size="9.8" fill="#8A8A8A" letter-spacing=".7">ASCII.PORTRAIT / SOURCE 01</text>
    <text x="368" y="121" text-anchor="end" class="mono" font-size="9.8" fill="#8A8A8A">ID/EPY</text>

<!-- Minimal ASCII portrait: simplified hair, glasses, silhouette and tailoring. -->
    <g class="ascii-art" mask="url(#portraitReveal)" clip-path="url(#asciiFrame)"><text font-family="'Courier New',monospace" font-size="6.9" fill="#F5F5F2" fill-opacity=".91" xml:space="preserve"><tspan x="65" y="159.00" textLength="296" lengthAdjust="spacingAndGlyphs">                                     ...                                </tspan><tspan x="65" y="165.65" textLength="296" lengthAdjust="spacingAndGlyphs">                               ..:::::::::::.                           </tspan><tspan x="65" y="172.30" textLength="296" lengthAdjust="spacingAndGlyphs">                           .:::::..........::::.                        </tspan><tspan x="65" y="178.95" textLength="296" lengthAdjust="spacingAndGlyphs">                         .::.............:::..:::.                      </tspan><tspan x="65" y="185.60" textLength="296" lengthAdjust="spacingAndGlyphs">                       .:........................:.                     </tspan><tspan x="65" y="192.25" textLength="296" lengthAdjust="spacingAndGlyphs">                     .:...........................:.                    </tspan><tspan x="65" y="198.90" textLength="296" lengthAdjust="spacingAndGlyphs">                    .:.............................:.                   </tspan><tspan x="65" y="205.55" textLength="296" lengthAdjust="spacingAndGlyphs">                   .:..............:................:                   </tspan><tspan x="65" y="212.20" textLength="296" lengthAdjust="spacingAndGlyphs">                  .:..........:::::::::::::.........:.                  </tspan><tspan x="65" y="218.85" textLength="296" lengthAdjust="spacingAndGlyphs">                  :........::::..      ..::--:.......:                  </tspan><tspan x="65" y="225.50" textLength="296" lengthAdjust="spacingAndGlyphs">                  :....:::::.               :--:::...:                  </tspan><tspan x="65" y="232.15" textLength="296" lengthAdjust="spacingAndGlyphs">                  :...:-:..        