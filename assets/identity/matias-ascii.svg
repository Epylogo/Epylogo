    <!-- A shared CSS phase aligns the reveal edge with the scanner. -->
    <g class="scanner-travel"><g class="scanner-light"><rect x="58" y="117" width="310" height="26" fill="url(#scanGlow)"/><path d="M58 130H368" stroke="#F5F5F2" stroke-width=".8" stroke-opacity=".7"/></g></g>
    <text x="58" y="484" class="mono" font-size="9.5" fill="#8A8A8A" letter-spacing="1.1">SCAN.STATUS / LIVE</text>
    <text x="368" y="484" text-anchor="end" class="mono" font-size="9.5" fill="#8A8A8A">01 / 01</text>
  </g>

  <g clip-path="url(#systemClip)">
    <rect x="408" y="98" width="554" height="398" fill="url(#grid)" opacity=".16"/>
    <text x="430" y="124" class="mono meta" font-size="10.2">EPYLOGO@GITHUB</text>
    <line x1="430" y1="136" x2="940" y2="136" class="hairline"/>
    <g class="ui">
      <text x="430" y="159" class="label">SUBJECT</text><line x1="574" y1="155" x2="621" y2="155" class="leader"/><text x="635" y="159" class="value">MATÍAS PIZARRO ACEVEDO</text>
      <text x="430" y="183" class="label">COUNTRY</text><line x1="574" y1="179" x2="621" y2="179" class="leader"/><text x="635" y="183" class="value">CHILE</text>
      <text x="430" y="207" class="label">DEGREE.01</text><line x1="574" y1="203" x2="621" y2="203" class="leader"/><text x="635" y="207" class="value">PROGRAMMER ANALYST</text>
      <text x="430" y="231" class="label">DEGREE.02</text><line x1="574" y1="227" x2="621" y2="227" class="leader"/><text x="635" y="231" class="value">INFORMATICS ENGINEER</text>
      <text x="430" y="255" class="label">FOCUS / FRONTEND</text><line x1="574" y1="251" x2="621" y2="251" class="leader"/><text x="635" y="255" class="value">REACT · TYPESCRIPT · JAVASCRIPT</text>
      <text x="430" y="279" class="label">UI</text><line x1="574" y1="275" x2="621" y2="275" class="leader"/><text x="635" y="279" class="value">TAILWIND · HTML · CSS · FIGMA</text>
      <text x="430" y="303" class="label">BACKEND</text><line x1="574" y1="299" x2="621" y2="299" class="leader"/><text x="635" y="303" class="value">NODE.JS · PYTHON · PHP · DJANGO</text>
      <text x="430" y="327" class="label">DATABASE</text><line x1="574" y1="323" x2="621" y2="323" class="leader"/><text x="635" y="327" class="value">MONGODB · MYSQL · ORACLE</text>
      <text x="430" y="351" class="label">ANALYSIS</text><line x1="574" y1="347" x2="621" y2="347" class="leader"/><text x="635" y="351" class="value">POWER BI · R STUDIO · KNIME</text>
      <text x="430" y="375" class="label">TOOLS</text><line x1="574" y1="371" x2="621" y2="371" class="leader"/><text x="635" y="375" class="value">GIT · GITHUB · POSTMAN · CURSOR</text>
    </g>
    <line x1="430" y1="393" x2="940" y2="393" class="hairline"/>
    <g class="ui">
      <text x="430" y="419" class="label">GITHUB</text><line x1="574" y1="415" x2="621" y2="415" class="leader"/><text x="635" y="419" class="value">EPYLOGO</text>
      <text x="430" y="443" class="label">LINKEDIN</text><line x1="574" y1="439" x2="621" y2="439" class="leader"/><text x="635" y="443" class="value">MATIAS-PIZARRO-ACEVEDO</text>
      <text x="430" y="467" class="label">CORREO</text><line x1="574" y1="463" x2="621" y2="463" class="leader"/><text x="635" y="467" class="value">MPA.MODULE@OUTLOOK.COM</text>
    </g>
  </g>

  <line x1="38" y1="520" x2="962" y2="520" class="hairline"/>
  <text x="38" y="548" class="mono" font-size="12.2" fill="#B5B5B1">epylogo@github ~ % whoami</text>
  <rect x="264" y="537" width="8" height="13" class="cursor"/>
  <g transform="translate(746 542)">
    <rect width="216" height="2" fill="#F5F5F2" opacity=".16"/>
    <rect width="216" height="2" class="signal-bar" style="transform-origin:left center"/>
  </g>
</svg>
