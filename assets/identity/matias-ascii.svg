  <line x1="38" y1="520" x2="962" y2="520" class="hairline"/>
  <text x="38" y="548" class="mono" font-size="12.2" fill="#B5B5B1">epylogo@github ~ % whoami</text>
  <rect x="239" y="537" width="8" height="13" class="cursor"/>
  <g transform="translate(746 542)">
    <rect width="216" height="2" fill="#F5F5F2" opacity=".16"/>
    <rect width="216" height="2" class="signal-bar" style="transform-origin:left center"/>
  </g>
</svg>
