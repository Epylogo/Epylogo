          <tspan x="59" dy="6.88">....                                                                    </tspan>
          <tspan x="59" dy="6.88">...                                                                     </tspan>
      </text>
    </g>

    <!-- Scanner line intentionally unchanged -->
    <g>
      <rect x="52" y="126" width="322" height="28" fill="url(#scanGlow)" opacity="0">
        <animate attributeName="y" values="126;446;446;126" keyTimes="0;.76;.92;1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".22 1 .36 1;.22 1 .36 1;.4 0 .2 1"/>
        <animate attributeName="opacity" values="0;.28;.16;0" keyTimes="0;.12;.92;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <line x1="58" x2="368" y1="139" y2="139" stroke="#F5F5F2" stroke-opacity=".72" stroke-width="1">
        <animate attributeName="y1" values="139;462;462;139" keyTimes="0;.76;.92;1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".22 1 .36 1;.22 1 .36 1;.4 0 .2 1"/>
        <animate attributeName="y2" values="139;462;462;139" keyTimes="0;.76;.92;1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines=".22 1 .36 1;.22 1 .36 1;.4 0 .2 1"/>
        <animate attributeName="stroke-opacity" values="0;.72;.42;0" keyTimes="0;.12;.92;1" dur="16s" repeatCount="indefinite"/>
      </line>
    </g>

    <text x="58" y="484" class="mono" font-size="9.5" fill="#8A8A8A" letter-spacing="1.1">SCAN.STATUS / LIVE</text>
    <text x="368" y="484" text-anchor="end" class="mono" font-size="9.5" fill="#8A8A8A">01 / 01</text>
  </g>

  <g clip-path="url(#systemClip)">
    <rect x="408" y="98" width="554" height="398" fill="url(#grid)" opacity=".16"/>
    <text x="430" y="124" class="mono meta" font-size="10.2">EPYLOGO@GITHUB</text>
    <line x1="430" y1="136" x2="940" y2="136" class="hairline"/>
    <g class="ui">
      <text x="430" y="159" class="label">SUBJECT</text><line x1="542" y1="155" x2="621" y2="155" class="leader"/><text x="635" y="159" class="value">MATÍAS PIZARRO ACEVEDO</text>
      <text x="430" y="183" class="label">COUNTRY</text><line x1="542" y1="179" x2="621" y2="179" class="leader"/><text x="635" y="183" class="value">CHILE</text>
      <text x="430" y="207" class="label">DEGREE.01</text><line x1="542" y1="203" x2="621" y2="203" class="leader"/><text x="635" y="207" class="value">PROGRAMMER ANALYST</text>
      <text x="430" y="231" class="label">DEGREE.02</text><line x1="542" y1="227" x2="621" y2="227" class="leader"/><text x="635" y="231" class="value">INFORMATICS ENGINEER</text>
      <text x="430" y="255" class="label">FOCUS / FRONTEND</text><line x1="542" y1="251" x2="621" y2="251" class="leader"/><text x="635" y="255" class="value">REACT · TYPESCRIPT · JAVASCRIPT</text>
      <text x="430" y="279" class="label">UI</text><line x1="542" y1="275" x2="621" y2="275" class="leader"/><text x="635" y="279" class="value">TAILWIND · HTML · CSS · FIGMA</text>
      <text x="430" y="303" class="label">BACKEND</text><line x1="542" y1="299" x2="621" y2="299" class="leader"/><text x="635" y="303" class="value">NODE.JS · PYTHON · PHP · DJANGO</text>
      <text x="430" y="327" class="label">DATABASE</text><line x1="542" y1="323" x2="621" y2="323" class="leader"/><text x="635" y="327" class="value">MONGODB · MYSQL · ORACLE</text>
      <text x="430" y="351" class="label">ANALYSIS</text><line x1="542" y1="347" x2="621" y2="347" class="leader"/><text x="635" y="351" class="value">POWER BI · R STUDIO · KNIME</text>
      <text x="430" y="375" class="label">TOOLS</text><line x1="542" y1="371" x2="621" y2="371" class="leader"/><text x="635" y="375" class="value">GIT · GITHUB · POSTMAN · CURSOR</text>
    </g>
    <line x1="430" y1="393" x2="940" y2="393" class="hairline"/>
    <g class="ui">
      <text x="430" y="419" class="label">GITHUB</text><line x1="542" y1="415" x2="621" y2="415" class="leader"/><text x="635" y="419" class="value">EPYLOGO</text>
      <text x="430" y="443" class="label">LINKEDIN</text><line x1="542" y1="439" x2="621" y2="439" class="leader"/><text x="635" y="443" class="value">MATIAS-PIZARRO-ACEVEDO</text>
      <text x="430" y="467" class="label">CORREO</text><line x1="542" y1="463" x2="621" y2="463" class="leader"/><text x="635" y="467" class="value">MPA.MODULE@OUTLOOK.COM</text>
    </g>
