<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none"
xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="portfolio-title portfolio-desc">
  <title id="portfolio-title">Portfolio access</title>
  <desc id="portfolio-desc">Direct access panel to selected work, case studies and UI/UX projects.</desc>
  <defs>
    <style>
      .display{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:800;letter-spacing:-.045em}
      .ctaText{font-family:"Arial Black",Impact,"Arial Narrow",Arial,sans-serif;font-weight:900;letter-spacing:-.035em}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
      .meta{fill:#B5B5B1;font-size:10.8px;letter-spacing:1.75px}.hairline{stroke:#F5F5F2;stroke-opacity:.16}
      .cursor{fill:#F5F5F2;animation:blink 1.15s steps(1,end) infinite}.online{fill:#F5F5F2;animation:pulse 3s ease-in-out infinite}
      .orbit{animation:rotate 12s linear infinite;transform-origin:870px 174px}.sweep{animation:rotate 18s linear infinite;transform-origin:870px 174px}
      .arrow{animation:nudge 3.2s cubic-bezier(.22,1,.36,1) infinite}.shine{animation:sweepPass 6.5s cubic-bezier(.22,1,.36,1) infinite}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes pulse{0%,100%{opacity:.32}50%{opacity:.95}}@keyframes rotate{to{transform:rotate(360deg)}}
      @keyframes nudge{0%,72%,100%{transform:translate(0,0)}82%{transform:translate(3px,-3px)}}
      @keyframes sweepPass{0%{transform:translateX(-220px);opacity:0}15%{opacity:.22}65%{opacity:.12}100%{transform:translateX(720px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.cursor,.online,.orbit,.sweep,.arrow,.shine{animation:none!important}}
    </style>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" stroke="#141414" stroke-width="1"/></pattern>
    <linearGradient id="bgFade" x1="0" y1="0" x2="1000" y2="330" gradientUnits="userSpaceOnUse"><stop stop-color="#050505"/><stop offset=".5" stop-color="#080808"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="ctaSheen" x1="0" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#F5F5F2" stop-opacity="0"/><stop offset=".48" stop-color="#FFFFFF" stop-opacity=".32"/><stop offset="1" stop-color="#F5F5F2" stop-opacity="0"/></linearGradient>
    <filter id="noise" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="ctaClip"><path d="M248 137H724L742 155V207H274L248 181V137Z"/></clipPath>
  </defs>

  <rect width="1000" height="330" fill="url(#bgFade)"/><rect width="1000" height="330" fill="url(#grid)" opacity=".34"/><rect width="1000" height="330" filter="url(#noise)" opacity=".018"/>
  <rect width="1000" height="2" fill="#F5F5F2" opacity=".78"/>

  <text x="38" y="31" class="mono meta">BRIEFCASE / 002</text><text x="962" y="31" text-anchor="end" class="mono meta">PORTFOLIO ACCESS · DIRECT LINK</text>
  <text x="38" y="68" class="display" font-size="24" fill="#F5F5F2">PORTFOLIO.ACCESS</text><line x1="38" y1="80" x2="962" y2="80" class="hairline"/>
  <text x="52" y="112" class="mono" font-size="11.2" fill="#8A8A8A" letter-spacing="1">DIRECT.ACCESS / SELECTED WORK</text>
  <circle cx="893" cy="108" r="3.5" class="online"/><circle cx="893" cy="108" r="8" fill="none" stroke="#F5F5F2" stroke-opacity=".12"/><text x="948" y="112" text-anchor="end" class="mono" font-size="11.2" fill="#B5B5B1">ONLINE</text>

  <path d="M259 146H730L749 165V214H285L259 188V146Z" fill="none" stroke="#F5F5F2" stroke-opacity=".22"/>
  <path d="M248 137H724L742 155V207H274L248 181V137Z" fill="#F5F5F2" stroke="#F5F5F2"/>
  <path d="M272 153H291M300 153H310" stroke="#050505" stroke-width="3" stroke-linecap="square"/>

  <g clip-path="url(#ctaClip)"><rect x="235" y="127" width="150" height="92" fill="url(#ctaSheen)" class="shine"/></g>
  <text x="489" y="181" text-anchor="middle" class="ctaText" font-size="24" fill="#050505">OPEN PORTFOLIO</text>
  <g class="arrow"><path d="M705 156H725V176M725 156L701 180" stroke="#050505" stroke-width="3.4" stroke-linecap="square"/></g>
  <!-- refined radar -->
  <g transform="translate(870 174)">
    <circle r="35" fill="none" stroke="#F5F5F2" stroke-opacity=".18"/>
    <circle r="23" fill="none" stroke="#F5F5F2" stroke-opacity=".16"/>
    <circle r="12" fill="none" stroke="#F5F5F2" stroke-opacity=".14"/>
    <line x1="-46" y1="0" x2="46" y2="0" stroke="#F5F5F2" stroke-opacity=".18"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#F5F5F2" stroke-opacity=".18"/>
    <circle r="3.5" fill="#F5F5F2" class="online"/>
    <circle r="7" fill="none" stroke="#F5F5F2" stroke-opacity=".08"/>

    <g opacity=".22">
      <path d="M0 0L27 0" stroke="#F5F5F2" stroke-width="1" stroke-linecap="round"/>
      <circle cx="27" cy="0" r="2.8" fill="#F5F5F2" opacity=".92"/>
      <circle cx="27" cy="0" r="5" fill="none" stroke="#F5F5F2" stroke-opacity=".14"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </g>

    <g>
      <path d="M0 0L23 0" stroke="#F5F5F2" stroke-opacity=".24" stroke-width="1" stroke-linecap="round"/>
      <circle cx="23" cy="0" r="2.8" fill="#F5F5F2" opacity=".92"/>
      <circle cx="23" cy="0" r="5" fill="none" stroke="#F5F5F2" stroke-opacity=".14"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="52" y="244" class="mono" font-size="10.9" fill="#8A8A8A">PROJECTS · CASE STUDIES · UI/UX</text>
  <line x1="38" y1="284" x2="962" y2="284" class="hairline"/><text x="38" y="310" class="mono" font-size="12.2" fill="#B5B5B1">epylogo@github ~ % ./briefcase.sh</text><rect x="297" y="299" width="8" height="13" class="cursor"/>
  <rect x="0" y="328" width="1000" height="2" fill="#F5F5F2" opacity=".56"/>
</svg>
